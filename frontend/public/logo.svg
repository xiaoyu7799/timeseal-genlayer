<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- TimeSeal mark: a gold hourglass inside a clock ring, sealed with violet wax. -->
  <rect width="240" height="240" fill="#0B1026"/>
  <circle cx="120" cy="120" r="112" fill="none" stroke="#E8B44A" stroke-width="5"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#E8B44A" stroke-width="1.5" opacity="0.6"/>
  <!-- clock ticks: 12 around the ring, longer at the quarters -->
  <g stroke="#E8B44A" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="12" x2="120" y2="24"/>
    <line x1="120" y1="12" x2="120" y2="24" transform="rotate(30 120 120)"/>
    <line x1="120" y1="12" x2="120" y2="24" transform="rotate(60 120 120)"/>
    <line x1="120" y1="10" x2="120" y2="26" transform="rotate(90 120 120)"/>
    <line x1="120" y1="12" x2="120" y2="24" transform="rotate(120 120 120)"/>
    <line x1="120" y1="12" x2="120" y2="24" transform="rotate(150 120 120)"/>
    <line x1="120" y1="10" x2="120" y2="26" transform="rotate(180 120 120)"/>
    <line x1="120" y1="12" x2="120" y2="24" transform="rotate(210 120 120)"/>
    <line x1="120" y1="12" x2="120" y2="24" transform="rotate(240 120 120)"/>
    <line x1="120" y1="10" x2="120" y2="26" transform="rotate(270 120 120)"/>
    <line x1="120" y1="12" x2="120" y2="24" transform="rotate(300 120 120)"/>
    <line x1="120" y1="12" x2="120" y2="24" transform="rotate(330 120 120)"/>
  </g>
  <!-- hourglass -->
  <g>
    <rect x="82" y="62" width="76" height="9" rx="4.5" fill="#E8B44A"/>
    <rect x="82" y="169" width="76" height="9" rx="4.5" fill="#E8B44A"/>
    <polygon points="88,71 152,71 120,120" fill="#E8B44A"/>
    <polygon points="88,169 152,169 120,120" fill="#E8B44A"/>
    <polygon points="96,73 144,73 120,108" fill="#B97F1F"/>
    <rect x="118.5" y="120" width="3" height="30" fill="#F2C96B"/>
    <polygon points="104,169 136,169 120,152" fill="#F2C96B"/>
  </g>
  <!-- wax seal -->
  <circle cx="186" cy="186" r="20" fill="#8B7CF6"/>
  <circle cx="186" cy="186" r="13" fill="none" stroke="#E8B44A" stroke-width="2"/>
  <circle cx="186" cy="186" r="4" fill="#E8B44A"/>
</svg>
